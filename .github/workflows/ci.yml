name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify fresh template download
        run: |
          npx --yes degit 'kjarisk/vibeTemplate#maintenance/final-followup' /tmp/vibe-fresh
          cd /tmp/vibe-fresh
          npm ci
          npm run build
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - run: npm run test:coverage
      - name: Check local development server
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vibe-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /tmp/vibe-index.html; then
              grep -q '<div id="root"></div>' /tmp/vibe-index.html
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vibe-vite.log
          exit 1
      - name: Report dependency advisories
        run: npm audit --audit-level=high
        continue-on-error: true
