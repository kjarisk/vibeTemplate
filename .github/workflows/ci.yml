name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Generate non-breaking lockfile updates
        run: npm audit fix --ignore-scripts
        continue-on-error: true
      - name: Save updated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: audited-lockfile
          path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - name: Report dependency advisories
        run: npm audit --audit-level=high
        continue-on-error: true
